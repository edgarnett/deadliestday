[project]
name = "notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.5.3",
    "pandas>=1.1.5",
]

[project.scripts]
notebooks = "notebooks:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
    "jupyter>=1.1.1",
]
